<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบจัดการลางานออนไลน์ - HR Portal</title>
  <!-- Open Graph Meta Tags for LINE Preview -->
  <meta property="og:title" content="ระบบจัดการลางานออนไลน์ - HR Portal">
  <meta property="og:description" content="ระบบจัดการลางานและประวัติวันลาบุคลากร">
  <meta property="og:type" content="website">
  <!-- Tailwind CSS & Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Prompt', sans-serif;
      background-color: #f8fafc;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* Loading Spinner */
    .loader {
      border: 3px solid #e2e8f0;
      border-top: 3px solid #6366f1;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="fixed inset-0 bg-slate-50 z-50 flex flex-col items-center justify-center space-y-3 transition-opacity duration-300">
    <div class="loader"></div>
    <p class="text-sm font-semibold text-slate-600">กำลังโหลดระบบลางาน...</p>
  </div>

  <!-- Fullscreen Iframe -->
  <iframe id="gasFrame" allow="geolocation; microphone; camera; midi; vr; accelerometer; gyroscope; payment; ambient-light-sensor" sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-top-navigation-by-user-activation"></iframe>

  <script>
    // ==============================================================
    // ⚙️ URL ของ Google Apps Script Web App
    // ==============================================================
    const APPS_SCRIPT_BASE_URL = "https://script.google.com/macros/s/AKfycbwYxUWukvm3W0owpTB1tC6JY7gLBRjdBf_uwGAI8D8gL2DeFOKQytJhpej_IAeJtpJT/exec";

    // ==============================================================
    // 🚀 ดึง Parameters ทั้งหมดจาก URL ของ GitHub Pages
    // เช่น ?page=form&userId=U62de4d5f49448d8ede38611d8f0a78e9
    // แล้วส่งต่อเข้าไปยัง Google Apps Script iframe อัตโนมัติ
    // ==============================================================
    function forwardParametersToIframe() {
      const queryString = window.location.search; // ได้ค่า เช่น ?page=form&userId=U...
      const iframe = document.getElementById("gasFrame");
      const loading = document.getElementById("loadingOverlay");

      // รวม URL และ parameters
      const targetUrl = queryString 
        ? APPS_SCRIPT_BASE_URL + queryString 
        : APPS_SCRIPT_BASE_URL + "?page=form";

      iframe.src = targetUrl;

      // ซ่อน Loading เมื่อ iframe โหลดเสร็จ
      iframe.onload = () => {
        loading.style.opacity = '0';
        setTimeout(() => {
          loading.style.display = 'none';
        }, 300);
      };
    }

    window.onload = forwardParametersToIframe;
  </script>
</body>
</html>
